spring.application.name=stockguard
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockguard}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
stockguard.jwt.secret=${JWT_SECRET}
stockguard.jwt.issuer=stockguard
stockguard.reservation.hold-duration=5m
stockguard.reservation.max-quantity=2
stockguard.reservation.max-pending=3
stockguard.reservation.expiry-batch-size=100
stockguard.reservation.expiry-interval-ms=5000
stockguard.reservation.expiry-enabled=true

stockguard.redis.enabled=${REDIS_ENABLED:false}
stockguard.redis.trust-render-edge-ip=${TRUST_RENDER_EDGE_IP:false}
stockguard.redis.cache-ttl=60s
stockguard.redis.rate-window=60s
stockguard.redis.auth-limit=20
stockguard.redis.reservation-limit=10
stockguard.redis.namespace=stockguard
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=${REDIS_ENABLED:false}
server.forward-headers-strategy=none

